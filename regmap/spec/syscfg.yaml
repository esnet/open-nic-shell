name: syscfg
info: |
  Xilinx OpenNIC Shell
  System config registers
regs:
  - default:
      width: 32

  - name: build_status
    access: ro
  - name: system_reset
    access: wo
    info: Write 1 to trigger the corresponding reset
    fields:
      - name: system_reset
        width: 1
  - name: system_status
    access: ro
    fields:
      - name: system_reset_done
        width: 1
  - name: shell_reset
    access: wo
    info: Write 1 to trigger the corresponding reset
    fields:
      - name: qdma_reset
        width: 1
      - name: cmac0_reset
        width: 1
      - name: cmac1_reset
        width: 1
  - name: shell_status
    access: ro
    fields:
      - name: qdma_reset_done
        width: 1
      - name: cmac0_reset_done
        width: 1
      - name: cmac1_reset_done
        width: 1
  - name: user_reset
    access: wo
    info: Write 1 to trigger the corresponding reset
  - name: user_status
    access: ro
  - name: usr_access
    access: ro
  - name: dna
    access: ro
    count: 3
  - name: card_vpd_control
    access: rw
    fields:
      - name: vpd_init_done_mask
        width: 1
  - name: card_vpd_status
    access: ro
    fields:
      - name: vpd_init_done
        width: 1
      - name: vpd_init_error
        width: 1
      - name: vpd_init_early_read
        width: 1
      - name: vpd_init_time_ms
        width: 14
      - name: card_info_vld
        width: 1
      - name: card_info_len
        width: 8
      - name: err_card_info_length
        width: 1
      - name: err_bad_axil_transaction
        width: 1
      - name: err_boot_timeout
        width: 1